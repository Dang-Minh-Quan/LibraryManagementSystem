spring.application.name=library-management

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_management}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Base64-encoded random key containing at least 32 decoded bytes. No default secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:library-management}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT1H}

server.error.include-message=never
server.error.include-stacktrace=never
